<!DOCTYPE html>
<html>

<head>
  <title>Score submission</title>
</head>

<body>
  <form action="/result" method="post">
    <p>Game version</p>
    <p>
      <input type="radio" name="game" value="Tetris: The Grand Master" /> Tetris: The Grand Master
      <input type="radio" name="game" value="Tetris: The Grand Master 2" /> Tetris: The Grand Master 2 
      <input type="radio" name="game" value="Tetris: The Grand Master 3" /> Tetris: The Grand Master 3
    </p>
    <p>Time</p>
    <p>
      <input type="text" name="time" />
    </p>
    <p>Score</p>
    <p>
      <input type="number" name="score" />
    </p>
    <p>Grade</p>
    <p>
      <input type="text" name="grade" />
    </p>
    <p>Additional options</p>
    <p>
      <input type="checkbox" name="extra" value="twentyg_mode" /> 20G mode
      <input type="checkbox" name="extra" value="big_mode" /> Big mode
    </p>
    <p>Description</p>
      <textarea name="description" rows="3" cols="50"></textarea>
    <input type="submit" value="Submit" />
  </form>
</body>

</html>
