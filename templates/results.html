<!DOCTYPE html>
<html>
  
  <body>
    <p style="text-align:right">
      <a href="/search_results">Search results </a>
    </p>
    {% for result in results %}
    <ul>
      <li>

        <a href="/result/{{ result.id }}">details</a>
        <br />
        <a href="/user/{{ result.user_id }}">{{ result.username }}</a>
        <br />
        time: {{ result.time }}  score: {{ result.score }}
        <br />
        {{ result.submitted_at }}
      </li>
    </ul>

  </body>
  {% endfor %}

</html>
